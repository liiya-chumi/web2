<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbrahs Kitchen - Gallery</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; background-color: #1a1a1a; color: #f0f0f0; }
        header { background-color: #000; padding: 1.5rem; text-align: center; border-bottom: 4px solid #e67e22; }
        header h1 { margin: 0; color: #e67e22; text-transform: uppercase; }
        
        /* CIRCLE LOGO STYLE */
        .logo-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #e67e22;
            margin-bottom: 10px;
            background-color: #000;
        }

        nav { background-color: #111; padding: 1rem; text-align: center; border-bottom: 1px solid #333; }
        nav a { color: #fff; text-decoration: none; padding: 0.5rem 1rem; display: inline-block; font-weight: bold; }
        nav a:hover { color: #e67e22; }
        main { padding: 2rem 1rem; max-width: 1000px; margin: auto; }
        h2 { color: #e67e22; text-align: center; text-transform: uppercase; margin-bottom: 2rem; }
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .gallery img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; border: 2px solid #333; cursor: pointer; transition: transform 0.3s, border-color 0.3s; }
        .gallery img:hover { transform: scale(1.03); border-color: #e67e22; }
        
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 10px; border: 3px solid #e67e22; }
        
        footer { background-color: #000; color: #888; text-align: center; padding: 2rem; margin-top: 3rem; border-top: 4px solid #e67e22; }
        footer a { color: #e67e22; }
    </style>
</head>
<body>

<header>
    <!-- Logo is now a circle -->
    <img src="Screenshot 2026-09-09 180137.png" alt="Barbrahs Kitchen Logo" class="logo-circle">
    <h1>Barbrahs Kitchen</h1>
    <p>Our Gallery</p>
</header>

<nav>
    <a href="index.html">Home</a> |
    <a href="menu.html">Menu</a> |
    <a href="about.html">About Us</a> |
    <a href="gallary.html">Gallery</a> |
    <a href="contact.html">Contact</a>
</nav>

<main>
    <h2>Our Delicious Food</h2>

    <div class="gallery">
        <!-- Using the actual food photos provided -->
        <img src="OIP (2).webp" alt="Delicious Kota with Russian">
        <img src="OIP (3).webp" alt="Delicious Kota with Vienna">
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <img src="" alt="Expanded view">
    </div>

    <script>
        const galleryImages = document.querySelectorAll('.gallery img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = lightbox.querySelector('img');

        galleryImages.forEach(img => {
            img.addEventListener('click', () => {
                lightbox.style.display = 'flex';
                lightboxImg.src = img.src;
            });
        });

        lightbox.addEventListener('click', () => {
            lightbox.style.display = 'none';
        });
    </script>
</main>

<footer>
    <p>&copy; 2026 Barbrahs Kitchen.</p>
</footer>

</body>
</html>
